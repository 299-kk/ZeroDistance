name: 问题反馈
description: 报告可复现的软件问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "不要提交账号令牌、联机密钥、未经脱敏的日志或个人信息。安全漏洞请通过 Security 私密报告。"
  - type: input
    id: version
    attributes:
      label: 启动器版本
      placeholder: 0.3.0 Preview
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、Minecraft 与加载器版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的日志或截图
