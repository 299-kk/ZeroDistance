name: Assemble 0.3.6 release asset
on: workflow_dispatch
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reassemble and verify the signed release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir parts
          gh release download v0.3.6 --pattern 'zd036-*' --dir parts
          test "$(find parts -maxdepth 1 -type f | wc -l)" -eq 38
          cat parts/zd036-* > ZeroDistance-0.3.6-windows-x64.zip
          echo 'fdcc1604473ac8a3828239399256e5906eae576b045e753c41e59c5bd62ec440  ZeroDistance-0.3.6-windows-x64.zip' | sha256sum -c -
          gh release upload v0.3.6 ZeroDistance-0.3.6-windows-x64.zip --clobber
          for f in parts/zd036-*; do gh release delete-asset v0.3.6 "$(basename "$f")" --yes; done
          gh release delete-asset v0.3.6 zd-036-probe --yes
          gh release delete-asset v0.3.6 zd-036-probe1m --yes
