name: ZeroDistance Windows Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Verify source and documentation
        run: |
          npm test
          npm run license:check
          npm run check:docs
          npm run check:public
      - name: Build desktop
        run: npm run build:native
      - name: Verify native services
        run: node native-launcher/scripts/verify-services.cjs
      - name: Package Windows installer and ZIP
        run: npm run package:native
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroDistance-windows-preview
          if-no-files-found: error
          path: |
            native-launcher/release/ZeroDistance-*-Setup.exe
            native-launcher/release/ZeroDistance-*-windows-x64.zip
            native-launcher/release/ZeroDistance-*-source.zip
            native-launcher/release/SHA256SUMS.txt
            native-launcher/release/SIZE.json
